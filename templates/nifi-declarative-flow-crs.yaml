# Declarative NiFi flow management template (NiFiKop external cluster mode)
#
# This file is intentionally under templates/ so Argo does not auto-apply it yet.
# After replacing placeholders, move/copy this content into manifests/.
#
# Requirements:
# - NiFiKop operator installed (k8s-kafka/manifests/nifi-kubernetes-operator.yaml)
# - NiFi API automation auth path (basic or tls)
# - Versioned flow metadata (bucketId/flowId/flowVersion)
# - If operator currently watches only `kafka`, extend watch scope to `dataflow`
#   before applying these CRs in `dataflow` namespace.
---
apiVersion: v1
kind: Secret
metadata:
  name: nifi-external-cluster-basic-auth
  namespace: dataflow
type: Opaque
stringData:
  # NiFi API automation account (non-human account).
  # NiFiKop basic mode calls /nifi-api/access/token with this username/password.
  username: "REPLACE_WITH_NIFI_API_USERNAME"
  password: "REPLACE_WITH_NIFI_API_PASSWORD"

  # PEM trust chain for the NiFi HTTPS certificate presented by
  # https://nifi.kafka.svc.cluster.local:8443
  # Leave empty only if cluster trust already contains the NiFi CA.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_NIFI_CA_CERT
    -----END CERTIFICATE-----
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiCluster
metadata:
  name: nifi-external
  namespace: dataflow
spec:
  type: external
  clientType: basic

  # Single-node NiFi in k8s-kafka namespace.
  nifiURI: "https://nifi.kafka.svc.cluster.local:8443"
  nodeURITemplate: "nifi-%d.nifi-hs.kafka.svc.cluster.local:8443"
  nodes:
    - id: 0

  # Root process group ID from NiFi canvas URL or NiFi API.
  rootProcessGroupId: "REPLACE_WITH_ROOT_PROCESS_GROUP_ID"

  secretRef:
    name: nifi-external-cluster-basic-auth
    namespace: dataflow
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiRegistryClient
metadata:
  name: batch-flow-registry
  namespace: dataflow
spec:
  clusterRef:
    name: nifi-external
    namespace: dataflow
  description: "Registry client for batch platform declarative flows"

  # Use your NiFi Registry endpoint (or equivalent backend reachable by NiFi).
  uri: "http://nifi-registry.kafka.svc.cluster.local:18080"
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiParameterContext
metadata:
  name: batch-kafka-context
  namespace: dataflow
spec:
  description: "Shared Kafka parameters for batch NiFi flows"
  clusterRef:
    name: nifi-external
    namespace: dataflow

  # Optional: expose secret keys as sensitive parameters by key name.
  secretRefs:
    - name: kafka-security-credentials
      namespace: dataflow

  parameters:
    - name: batch.kafka.bootstrap.servers
      value: kafka.kafka.svc.internal.lan:9092
      description: Kafka bootstrap servers
    - name: batch.kafka.security.protocol
      value: SASL_PLAINTEXT
      description: Kafka security protocol
    - name: batch.kafka.sasl.mechanism
      value: SCRAM-SHA-256
      description: Kafka SASL mechanism
    - name: batch.kafka.input.topic
      value: batch.example.nifi.raw.v1
      description: NiFi to Flink input topic
    - name: batch.kafka.output.topic
      value: batch.example.flink.enriched.v1
      description: Flink to NiFi output topic
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiDataflow
metadata:
  name: batch-nifi-kafka-example
  namespace: dataflow
spec:
  displayName: "batch-nifi-kafka-example"

  # Set to rootProcessGroupId or another parent process group where flow should live.
  parentProcessGroupID: "REPLACE_WITH_PARENT_PROCESS_GROUP_ID"

  # Versioned flow metadata from NiFi Registry.
  bucketId: "REPLACE_WITH_BUCKET_ID"
  flowId: "REPLACE_WITH_FLOW_ID"
  flowVersion: 1

  flowPosition:
    posX: 0
    posY: 0

  syncMode: always
  updateStrategy: drain
  skipInvalidControllerService: true
  skipInvalidComponent: true

  clusterRef:
    name: nifi-external
    namespace: dataflow
  registryClientRef:
    name: batch-flow-registry
    namespace: dataflow
  parameterContextRef:
    name: batch-kafka-context
    namespace: dataflow
