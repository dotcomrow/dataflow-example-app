# ============================================================================
# Declarative NiFi flow management (waves 60-66)
# - Uses NiFiKop external-cluster mode against NiFi in kafka namespace
# - Keeps NiFi workflows in Git/Kubernetes resources (GitOps source of truth)
#
# IMPORTANT
# 1) Set real values before first production sync:
#    - registry bucket/flow IDs
#    - TLS client certificate secret values
# 2) Registry flow version 1 is bootstrapped by Job in this file.
# 3) NiFiKop must watch `dataflow` namespace (configured in k8s-kafka repo).
# ============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: nifi-external-cluster-tls-auth
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "60"
type: Opaque
stringData:
  # PEM client certificate/key NiFiKop will present to NiFi API.
  # The cert identity must be authorized in NiFi.
  tls.crt: "<path:secret/data/k8s-kafka-nifikop-client-cert-pem#value>"
  tls.key: "<path:secret/data/k8s-kafka-nifikop-client-key-pem#value>"

  # PEM CA chain used to validate NiFi HTTPS cert.
  ca.crt: "<path:secret/data/k8s-kafka-nifi-ca-cert-pem#value>"
  # Required by NiFiKop TLS external-cluster auth contract.
  password: "<path:secret/data/k8s-kafka-nifi-keystore-password#value>"
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiCluster
metadata:
  name: nifi-external
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "61"
spec:
  type: external
  clientType: tls
  rootProcessGroupId: "root"

  nifiURI: "nifi.kafka.svc.cluster.local:8443"
  nodeURITemplate: "nifi-%d.nifi-hs.kafka.svc.cluster.local:8443"
  nodes:
    - id: 0

  secretRef:
    name: nifi-external-cluster-tls-auth
    namespace: dataflow
---
apiVersion: nifi.konpyutaika.com/v2alpha1
kind: NifiRegistryClient
metadata:
  name: batch-flow-registry
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "62"
spec:
  clusterRef:
    name: nifi-external
    namespace: dataflow
  description: "Registry client for dataflow declarative NiFi workflows"
  type: registry
  registryClientConfig:
    uri: "http://nifi-registry.dataflow.svc.cluster.local:18080"
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiParameterContext
metadata:
  name: batch-kafka-context
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "63"
spec:
  description: "Shared Kafka parameters for batch NiFi workflows"
  clusterRef:
    name: nifi-external
    namespace: dataflow
  secretRefs:
    - name: kafka-security-credentials
      namespace: dataflow
  parameters:
    - name: batch.kafka.bootstrap.servers
      value: kafka.kafka.svc.internal.lan:9092
      description: Kafka bootstrap servers
    - name: batch.kafka.security.protocol
      value: SASL_PLAINTEXT
      description: Kafka security protocol
    - name: batch.kafka.sasl.mechanism
      value: SCRAM-SHA-256
      description: Kafka SASL mechanism
    - name: batch.kafka.stage1.input.topic
      value: batch.example.stage1.input.v1
      description: Flink stage 1 input topic
    - name: batch.kafka.stage1.flink_to_nifi.topic
      value: batch.example.stage1.flink-to-nifi.v1
      description: Flink stage 1 output topic consumed by NiFi stage 1
    - name: batch.kafka.stage2.nifi_to_flink.topic
      value: batch.example.stage2.nifi-to-flink.v1
      description: NiFi stage 1 output topic consumed by Flink stage 2
    - name: batch.kafka.stage2.flink_to_nifi.topic
      value: batch.example.stage2.flink-to-nifi.v1
      description: Flink stage 2 output topic consumed by NiFi stage 2
    - name: batch.kafka.final.topic
      value: batch.example.stage3.nifi-final.v1
      description: Final output topic from NiFi stage 2
    - name: batch.kafka.stage1.nifi.group.id
      value: nifi-batch-stage1-v1
      description: NiFi stage 1 consumer group
    - name: batch.kafka.stage2.nifi.group.id
      value: nifi-batch-stage2-v1
      description: NiFi stage 2 consumer group
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-nifi-registry-bootstrap-version
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "64"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-nifi-registry-bootstrap-version
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap-registry-flow-version
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NIFI_REGISTRY_API
              value: "http://nifi-registry.dataflow.svc.cluster.local:18080/nifi-registry-api"
            - name: NIFI_REGISTRY_BUCKET_ID
              value: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
            - name: NIFI_REGISTRY_FLOW_ID
              value: "<path:secret/data/k8s-kafka-nifi-registry-flow-id#value>"
            - name: NIFI_REGISTRY_FLOW_NAME
              value: "batch-nifi-kafka-example"
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail

              check_http() {
                local method="$1"
                local url="$2"
                local body_file="${3:-}"
                local status=""
                if [ -n "${body_file}" ]; then
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" \
                    -H "Content-Type: application/json" "${url}" --data @"${body_file}" || true)"
                else
                  status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X "${method}" "${url}" || true)"
                fi
                echo "${status}"
              }

              echo "Waiting for NiFi Registry API..."
              ready="false"
              for _ in $(seq 1 120); do
                code="$(check_http GET "${NIFI_REGISTRY_API}/buckets")"
                if [ "${code}" = "200" ]; then
                  ready="true"
                  break
                fi
                sleep 2
              done
              if [ "${ready}" != "true" ]; then
                echo "NiFi Registry API is not ready."
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}")"
              if [ "${code}" != "200" ]; then
                echo "Registry bucket id not found: ${NIFI_REGISTRY_BUCKET_ID}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}")"
              if [ "${code}" != "200" ]; then
                echo "Registry flow id not found: ${NIFI_REGISTRY_FLOW_ID} in bucket ${NIFI_REGISTRY_BUCKET_ID}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}/versions/1")"
              if [ "${code}" = "200" ]; then
                echo "Flow version 1 already exists; nothing to do."
                exit 0
              fi
              if [ "${code}" != "404" ]; then
                echo "Unexpected response checking flow version 1: HTTP ${code}"
                cat /tmp/resp.json || true
                exit 1
              fi

              cat > /tmp/flow-v1.json <<EOF
              {
                "snapshotMetadata": {
                  "bucketIdentifier": "${NIFI_REGISTRY_BUCKET_ID}",
                  "flowIdentifier": "${NIFI_REGISTRY_FLOW_ID}",
                  "version": 1
                },
                "flowContents": {
                  "identifier": "root-group",
                  "name": "${NIFI_REGISTRY_FLOW_NAME}",
                  "comments": "Initial declarative flow snapshot",
                  "processGroups": [],
                  "remoteProcessGroups": [],
                  "processors": [],
                  "inputPorts": [],
                  "outputPorts": [],
                  "connections": [],
                  "labels": [],
                  "funnels": []
                }
              }
              EOF

              code="$(check_http POST "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}/versions" /tmp/flow-v1.json)"
              if [ "${code}" != "200" ] && [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
                echo "Failed creating flow version 1: HTTP ${code}"
                cat /tmp/resp.json || true
                exit 1
              fi

              code="$(check_http GET "${NIFI_REGISTRY_API}/buckets/${NIFI_REGISTRY_BUCKET_ID}/flows/${NIFI_REGISTRY_FLOW_ID}/versions/1")"
              if [ "${code}" != "200" ]; then
                echo "Flow version 1 was not found after bootstrap."
                cat /tmp/resp.json || true
                exit 1
              fi

              echo "Flow version 1 is ready."
---
apiVersion: nifi.konpyutaika.com/v1
kind: NifiDataflow
metadata:
  name: batch-nifi-kafka-example
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  displayName: "batch-nifi-kafka-example"
  parentProcessGroupID: "root"

  # Versioned flow metadata from NiFi Registry.
  bucketId: "<path:secret/data/k8s-kafka-nifi-registry-bucket-id#value>"
  flowId: "<path:secret/data/k8s-kafka-nifi-registry-flow-id#value>"
  flowVersion: 1

  flowPosition:
    posX: 0
    posY: 0

  # Keep dataflow import declarative but avoid continuous overwrite so
  # manifest-driven bootstrap jobs can manage in-group processor topology.
  syncMode: once
  updateStrategy: drain
  skipInvalidControllerService: true
  skipInvalidComponent: true

  clusterRef:
    name: nifi-external
    namespace: dataflow
  registryClientRef:
    name: batch-flow-registry
    namespace: dataflow
  parameterContextRef:
    name: batch-kafka-context
    namespace: dataflow
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-nifi-stage-chain-bootstrap-v2
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "66"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-nifi-stage-chain-bootstrap-v2
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: nifi-tls
          secret:
            secretName: nifi-external-cluster-tls-auth
      containers:
        - name: bootstrap-nifi-stage-chain
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nifi-tls
              mountPath: /tls
              readOnly: true
          env:
            - name: NIFI_API_BASE
              value: "https://nifi.kafka.svc.cluster.local:8443/nifi-api"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_NIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: KAFKA_NIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
            - name: TOPIC_STAGE1_FLINK_TO_NIFI
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_to_nifi_stage1
            - name: TOPIC_STAGE2_NIFI_TO_FLINK
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_nifi_stage1_to_flink_stage2
            - name: TOPIC_STAGE2_FLINK_TO_NIFI
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage2_to_nifi_stage2
            - name: TOPIC_FINAL
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_nifi_stage2_final
            - name: RULES_ENGINE_INVOKE_URL
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: rules_engine_invoke_url
            - name: OPENWEBUI_INVOKE_URL
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: openwebui_invoke_url
            - name: NIFI_STAGE1_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: nifi_stage1_consumer_group
            - name: NIFI_STAGE2_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: nifi_stage2_consumer_group
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -euo pipefail

              apk add --no-cache curl jq >/dev/null

              log() {
                echo "⏱️  $(date -u +%Y-%m-%dT%H:%M:%SZ) $*" >&2
              }

              is_retryable_http_code() {
                case "$1" in
                  409|423|429|500|502|503|504|000) return 0 ;;
                  *) return 1 ;;
                esac
              }

              nifi_get() {
                local path="$1"
                local code=""
                local body_file="/tmp/nifi-get.json"
                local err_file="/tmp/nifi-get.err"
                local insecure_body_file="/tmp/nifi-get-insecure.json"
                local insecure_err_file="/tmp/nifi-get-insecure.err"

                for i in $(seq 1 40); do
                  code="$(curl -sS \
                    --write-out "%{http_code}" \
                    --output "${body_file}" \
                    --cacert /tls/ca.crt \
                    --cert /tls/tls.crt \
                    --key /tls/tls.key \
                    "${NIFI_API_BASE}${path}" 2>"${err_file}" || true)"
                  if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
                    cat "${body_file}"
                    return 0
                  fi

                  code="$(curl -sS \
                    --write-out "%{http_code}" \
                    --output "${insecure_body_file}" \
                    --insecure \
                    --cert /tls/tls.crt \
                    --key /tls/tls.key \
                    "${NIFI_API_BASE}${path}" 2>"${insecure_err_file}" || true)"
                  if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
                    cat "${insecure_body_file}"
                    return 0
                  fi

                  if is_retryable_http_code "${code}"; then
                    if [ $((i % 5)) -eq 0 ]; then
                      log "GET ${path} returned HTTP ${code} (attempt ${i}/40)"
                    fi
                    sleep 2
                    continue
                  fi

                  cat "${insecure_body_file}" >&2 || true
                  cat "${insecure_err_file}" >&2 || true
                  return 1
                done

                cat "${insecure_body_file}" >&2 || true
                cat "${insecure_err_file}" >&2 || true
                return 1
              }

              nifi_json() {
                local method="$1"
                local path="$2"
                local payload_file="$3"
                local code=""
                local body_file="/tmp/nifi-json.json"
                local err_file="/tmp/nifi-json.err"
                local insecure_body_file="/tmp/nifi-json-insecure.json"
                local insecure_err_file="/tmp/nifi-json-insecure.err"

                for i in $(seq 1 40); do
                  code="$(curl -sS \
                    --write-out "%{http_code}" \
                    --output "${body_file}" \
                    --cacert /tls/ca.crt \
                    --cert /tls/tls.crt \
                    --key /tls/tls.key \
                    -H "Content-Type: application/json" \
                    -X "${method}" \
                    "${NIFI_API_BASE}${path}" \
                    --data @"${payload_file}" 2>"${err_file}" || true)"
                  if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
                    cat "${body_file}"
                    return 0
                  fi

                  code="$(curl -sS \
                    --write-out "%{http_code}" \
                    --output "${insecure_body_file}" \
                    --insecure \
                    --cert /tls/tls.crt \
                    --key /tls/tls.key \
                    -H "Content-Type: application/json" \
                    -X "${method}" \
                    "${NIFI_API_BASE}${path}" \
                    --data @"${payload_file}" 2>"${insecure_err_file}" || true)"
                  if [ "${code}" -ge 200 ] 2>/dev/null && [ "${code}" -lt 300 ] 2>/dev/null; then
                    cat "${insecure_body_file}"
                    return 0
                  fi

                  if is_retryable_http_code "${code}"; then
                    if [ $((i % 5)) -eq 0 ]; then
                      log "${method} ${path} returned HTTP ${code} (attempt ${i}/40)"
                    fi
                    sleep 2
                    continue
                  fi

                  cat "${insecure_body_file}" >&2 || true
                  cat "${insecure_err_file}" >&2 || true
                  return 1
                done

                cat "${insecure_body_file}" >&2 || true
                cat "${insecure_err_file}" >&2 || true
                return 1
              }

              log "Waiting for NiFi API root process-group endpoint..."
              ready="false"
              for i in $(seq 1 180); do
                if nifi_get "/process-groups/root/process-groups" >/tmp/nifi-root-process-groups.json 2>/tmp/nifi-api.err; then
                  ready="true"
                  break
                fi
                if [ $((i % 12)) -eq 0 ]; then
                  log "Still waiting for NiFi API root endpoint (attempt ${i}/180)"
                fi
                sleep 5
              done
              if [ "${ready}" != "true" ]; then
                log "NiFi API did not become ready."
                cat /tmp/nifi-api.err || true
                exit 1
              fi

              log "Waiting for target process group batch-nifi-kafka-example..."
              TARGET_PG_ID=""
              root_children=""
              for i in $(seq 1 120); do
                root_children="$(nifi_get "/process-groups/root/process-groups" 2>/tmp/nifi-api.err || true)"
                TARGET_PG_ID="$(echo "${root_children}" | jq -r '.processGroups[]? | select(.component.name=="batch-nifi-kafka-example") | .id' | head -n1)"
                if [ -n "${TARGET_PG_ID}" ] && [ "${TARGET_PG_ID}" != "null" ]; then
                  break
                fi
                if [ $((i % 12)) -eq 0 ]; then
                  log "Target process group not visible yet (attempt ${i}/120)"
                fi
                sleep 5
              done
              if [ -z "${TARGET_PG_ID}" ] || [ "${TARGET_PG_ID}" = "null" ]; then
                log "Target process group batch-nifi-kafka-example not found under root."
                echo "${root_children}" | jq '.processGroups[]?.component.name' || true
                exit 1
              fi
              log "Target process group id: ${TARGET_PG_ID}"

              get_processor_id() {
                local proc_name="$1"
                nifi_get "/process-groups/${TARGET_PG_ID}/processors" \
                  | jq -r --arg n "${proc_name}" '.processors[]? | select(.component.name==$n) | .id' \
                  | head -n1
              }

              get_processor_version() {
                local proc_id="$1"
                nifi_get "/processors/${proc_id}" | jq -r '.revision.version // 0'
              }

              get_processor_state() {
                local proc_id="$1"
                nifi_get "/processors/${proc_id}" | jq -r '.component.state // .status.aggregateSnapshot.runStatus // "UNKNOWN"'
              }

              stop_processor_if_running() {
                local proc_id="$1"
                local state=""
                local payload="/tmp/stop-${proc_id}.json"
                local revision=""

                state="$(get_processor_state "${proc_id}")"
                if [ "${state}" != "RUNNING" ]; then
                  return 0
                fi

                log "Stopping processor ${proc_id} before configuration update"
                revision="$(get_processor_version "${proc_id}")"
                jq -n \
                  --argjson version "${revision}" \
                  '{
                    revision: {version: $version},
                    disconnectedNodeAcknowledged: true,
                    state: "STOPPED"
                  }' > "${payload}"
                nifi_json "PUT" "/processors/${proc_id}/run-status" "${payload}" >/tmp/stop-processor-response.json

                for i in $(seq 1 30); do
                  state="$(get_processor_state "${proc_id}")"
                  if [ "${state}" != "RUNNING" ]; then
                    return 0
                  fi
                  sleep 1
                done
                log "Timed out waiting for processor ${proc_id} to stop"
                return 1
              }

              resolve_relationship_name() {
                local proc_id="$1"
                local requested="$2"
                local available=""
                local matched=""

                available="$(nifi_get "/processors/${proc_id}" | jq -r '.component.relationships[]?.name' || true)"
                if [ -z "${available}" ]; then
                  echo "${requested}"
                  return 0
                fi

                if printf '%s\n' "${available}" | grep -Fxq "${requested}"; then
                  echo "${requested}"
                  return 0
                fi

                matched="$(printf '%s\n' "${available}" | awk -v req="${requested}" 'BEGIN{IGNORECASE=1} $0==req {print; exit}')"
                if [ -n "${matched}" ]; then
                  echo "${matched}"
                  return 0
                fi

                echo "${requested}"
              }

              get_controller_service_id() {
                local service_name="$1"
                local proc_id=""
                local service_id=""
                local proc_name=""
                for proc_name in \
                  "batch-stage1-consume-kafka" \
                  "batch-stage1-publish-kafka" \
                  "batch-stage2-consume-kafka" \
                  "batch-stage2-publish-kafka"; do
                  proc_id="$(get_processor_id "${proc_name}" || true)"
                  if [ -z "${proc_id}" ] || [ "${proc_id}" = "null" ]; then
                    continue
                  fi
                  service_id="$(nifi_get "/processors/${proc_id}" \
                    | jq -r '.component.config.properties["Kafka Connection Service"] // empty' \
                    | head -n1 || true)"
                  if [ -n "${service_id}" ] && [ "${service_id}" != "null" ]; then
                    echo "${service_id}"
                    return 0
                  fi
                done
                return 1
              }

              get_controller_service_version() {
                local service_id="$1"
                nifi_get "/controller-services/${service_id}" | jq -r '.revision.version // 0'
              }

              ensure_kafka_connection_service() {
                local service_name="batch-kafka-connection-service"
                local service_type="org.apache.nifi.kafka.service.Kafka3ConnectionService"
                local create_payload="/tmp/create-controller-service.json"
                local update_payload="/tmp/update-controller-service.json"
                local run_payload="/tmp/run-controller-service.json"
                local service_id=""
                local service_rev=""
                local service_props=""
                local state=""
                local validation_status=""
                local validation_errors=""
                local service_state_json=""
                local enabled="false"
                local attempt=""
                local updated="false"
                local existing_service="false"

                service_props="$(jq -n \
                  --arg brokers "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --arg sec "${KAFKA_SECURITY_PROTOCOL}" \
                  --arg mech "${KAFKA_SASL_MECHANISM}" \
                  --arg username "${KAFKA_NIFI_USERNAME}" \
                  --arg password "${KAFKA_NIFI_PASSWORD}" \
                  '{
                    "bootstrap.servers": $brokers,
                    "security.protocol": $sec,
                    "sasl.mechanism": $mech,
                    "sasl.username": $username,
                    "sasl.password": $password
                  }')"

                service_id="$(get_controller_service_id "${service_name}" || true)"
                if [ -n "${service_id}" ] && [ "${service_id}" != "null" ]; then
                  existing_service="true"
                fi
                if [ "${existing_service}" != "true" ]; then
                  jq -n \
                    --arg name "${service_name}" \
                    --arg type "${service_type}" \
                    --argjson props "${service_props}" \
                    '{
                      revision: {version: 0},
                      component: {
                        name: $name,
                        type: $type,
                        properties: $props
                      }
                    }' > "${create_payload}"
                  log "Creating controller service ${service_name}"
                  nifi_json "POST" "/process-groups/${TARGET_PG_ID}/controller-services" "${create_payload}" >/tmp/create-controller-service-response.json
                  service_id="$(jq -r '.id // .component.id' /tmp/create-controller-service-response.json)"
                fi

                if [ -z "${service_id}" ] || [ "${service_id}" = "null" ]; then
                  log "Unable to resolve controller service id for ${service_name}"
                  cat /tmp/create-controller-service-response.json || true
                  exit 1
                fi

                # NiFi requires disabling a running controller service before config mutation.
                # For idempotent re-runs of this bootstrap job, reuse the existing enabled service.
                if [ "${existing_service}" = "true" ]; then
                  service_state_json="$(nifi_get "/controller-services/${service_id}" 2>/tmp/get-controller-service.err || true)"
                  state="$(echo "${service_state_json}" | jq -r '.component.state // .status.runStatus // "UNKNOWN"')"
                  validation_status="$(echo "${service_state_json}" | jq -r '.component.validationStatus // .status.validationStatus // "UNKNOWN"')"
                  if [ "${state}" = "ENABLED" ]; then
                    log "Controller service ${service_name} already ENABLED (validation=${validation_status}); reusing existing service"
                    echo "${service_id}"
                    return 0
                  fi
                fi

                log "Updating controller service ${service_name}"
                for attempt in $(seq 1 25); do
                  service_rev="$(get_controller_service_version "${service_id}")"
                  jq -n \
                    --arg id "${service_id}" \
                    --argjson version "${service_rev}" \
                    --argjson props "${service_props}" \
                    '{
                      revision: {version: $version},
                      disconnectedNodeAcknowledged: true,
                      component: {
                        id: $id,
                        properties: $props
                      }
                    }' > "${update_payload}"
                  if nifi_json "PUT" "/controller-services/${service_id}" "${update_payload}" >/tmp/update-controller-service-response.json; then
                    updated="true"
                    break
                  fi
                  if [ $((attempt % 5)) -eq 0 ]; then
                    log "Controller service update still retrying (attempt ${attempt}/25)"
                  fi
                  sleep 2
                done
                if [ "${updated}" != "true" ]; then
                  log "Failed to update controller service ${service_name}"
                  cat /tmp/update-controller-service-response.json >&2 || true
                  exit 1
                fi

                for i in $(seq 1 60); do
                  service_rev="$(get_controller_service_version "${service_id}")"
                  jq -n \
                    --argjson version "${service_rev}" \
                    '{
                      revision: {version: $version},
                      disconnectedNodeAcknowledged: true,
                      state: "ENABLED"
                    }' > "${run_payload}"

                  nifi_json "PUT" "/controller-services/${service_id}/run-status" "${run_payload}" >/tmp/run-controller-service-response.json 2>/tmp/run-controller-service.err || true

                  service_state_json="$(nifi_get "/controller-services/${service_id}" 2>/tmp/get-controller-service.err || true)"
                  if [ -z "${service_state_json}" ]; then
                    log "Controller service status read failed (attempt ${i}/60)"
                    sleep 2
                    continue
                  fi
                  state="$(echo "${service_state_json}" | jq -r '.component.state // .status.runStatus // "UNKNOWN"')"
                  validation_status="$(echo "${service_state_json}" | jq -r '.component.validationStatus // .status.validationStatus // "UNKNOWN"')"
                  log "Controller service state: ${state}, validation: ${validation_status} (attempt ${i}/60)"
                  if [ "${state}" = "ENABLED" ]; then
                    enabled="true"
                    break
                  fi
                  sleep 2
                done

                if [ "${enabled}" != "true" ]; then
                  log "Failed to enable controller service ${service_name}"
                  nifi_get "/controller-services/${service_id}" >/tmp/controller-service-details.json || true
                  validation_errors="$(jq -r '.component.validationErrors[]?' /tmp/controller-service-details.json || true)"
                  if [ -n "${validation_errors}" ]; then
                    echo "${validation_errors}" >&2
                  fi
                  exit 1
                fi

                echo "${service_id}"
              }

              ensure_processor() {
                local proc_name="$1"
                local proc_type="$2"
                local pos_x="$3"
                local pos_y="$4"
                local attempt=""
                local existing_id=""
                local created_id=""
                local payload="/tmp/create-${proc_name}.json"

                for attempt in $(seq 1 25); do
                  existing_id="$(get_processor_id "${proc_name}" || true)"
                  if [ -n "${existing_id}" ] && [ "${existing_id}" != "null" ]; then
                    echo "${existing_id}"
                    return 0
                  fi

                  jq -n \
                    --arg name "${proc_name}" \
                    --arg type "${proc_type}" \
                    --argjson x "${pos_x}" \
                    --argjson y "${pos_y}" \
                    '{
                      revision: {version: 0},
                      component: {
                        name: $name,
                        type: $type,
                        position: {x: $x, y: $y}
                      }
                    }' > "${payload}"

                  log "Creating processor ${proc_name} (attempt ${attempt}/25)"
                  if nifi_json "POST" "/process-groups/${TARGET_PG_ID}/processors" "${payload}" >/tmp/create-processor-response.json 2>/tmp/create-processor.err; then
                    created_id="$(jq -r '.id // .component.id // empty' /tmp/create-processor-response.json || true)"
                    if [ -n "${created_id}" ]; then
                      echo "${created_id}"
                      return 0
                    fi
                  fi

                  log "Processor create call did not complete yet for ${proc_name}, retrying"
                  existing_id="$(get_processor_id "${proc_name}" || true)"
                  if [ -n "${existing_id}" ] && [ "${existing_id}" != "null" ]; then
                    echo "${existing_id}"
                    return 0
                  fi
                  sleep 2
                done

                log "Failed to ensure processor ${proc_name}"
                cat /tmp/create-processor-response.json >&2 || true
                cat /tmp/create-processor.err >&2 || true
                exit 1
              }

              ensure_processor_properties() {
                local proc_id="$1"
                local properties_json="$2"
                local auto_terminated_json="$3"
                local payload="/tmp/update-${proc_id}.json"
                local revision=""
                local attempt=""

                for attempt in $(seq 1 25); do
                  stop_processor_if_running "${proc_id}" || true
                  revision="$(get_processor_version "${proc_id}")"

                  jq -n \
                    --arg id "${proc_id}" \
                    --argjson version "${revision}" \
                    --argjson props "${properties_json}" \
                    --argjson autoTerm "${auto_terminated_json}" \
                    '{
                      revision: {version: $version},
                      disconnectedNodeAcknowledged: true,
                      component: {
                        id: $id,
                        config: {
                          properties: $props,
                          autoTerminatedRelationships: $autoTerm
                        }
                      }
                    }' > "${payload}"

                  if nifi_json "PUT" "/processors/${proc_id}" "${payload}" >/tmp/update-processor-response.json; then
                    return 0
                  fi
                  if [ $((attempt % 5)) -eq 0 ]; then
                    log "Processor property update still retrying for ${proc_id} (attempt ${attempt}/25)"
                  fi
                  sleep 2
                done
                log "Failed to update processor properties for ${proc_id}"
                return 1
              }

              ensure_connection() {
                local source_id="$1"
                local destination_id="$2"
                local relationship="$3"
                local conn_name="$4"
                local effective_relationship=""
                local existing=""
                local payload="/tmp/connection-${conn_name}.json"
                local attempt=""

                effective_relationship="$(resolve_relationship_name "${source_id}" "${relationship}")"

                for attempt in $(seq 1 25); do
                  existing="$(nifi_get "/process-groups/${TARGET_PG_ID}/connections" \
                    | jq -r --arg s "${source_id}" --arg d "${destination_id}" --arg r "${effective_relationship}" \
                      '.connections[]? | select(.component.source.id==$s and .component.destination.id==$d and ((.component.selectedRelationships // []) | index($r))) | .id' \
                    | head -n1)"

                  if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
                    return 0
                  fi

                  jq -n \
                    --arg sourceId "${source_id}" \
                    --arg destinationId "${destination_id}" \
                    --arg groupId "${TARGET_PG_ID}" \
                    --arg rel "${effective_relationship}" \
                    --arg name "${conn_name}" \
                    '{
                      revision: {version: 0},
                      component: {
                        name: $name,
                        source: {id: $sourceId, groupId: $groupId, type: "PROCESSOR"},
                        destination: {id: $destinationId, groupId: $groupId, type: "PROCESSOR"},
                        selectedRelationships: [$rel],
                        backPressureObjectThreshold: 10000,
                        backPressureDataSizeThreshold: "1 GB",
                        flowFileExpiration: "0 sec"
                      }
                    }' > "${payload}"

                  if nifi_json "POST" "/process-groups/${TARGET_PG_ID}/connections" "${payload}" >/tmp/create-connection-response.json 2>/tmp/create-connection.err; then
                    return 0
                  fi
                  if [ $((attempt % 5)) -eq 0 ]; then
                    log "Connection create still retrying for ${conn_name} (attempt ${attempt}/25)"
                  fi
                  sleep 2
                done
                log "Failed to ensure connection ${conn_name}"
                cat /tmp/create-connection-response.json >&2 || true
                cat /tmp/create-connection.err >&2 || true
                return 1
              }

              start_processor() {
                local proc_id="$1"
                local revision=""
                local payload="/tmp/run-${proc_id}.json"
                local attempt=""
                for attempt in $(seq 1 25); do
                  revision="$(get_processor_version "${proc_id}")"

                  jq -n \
                    --argjson version "${revision}" \
                    '{
                      revision: {version: $version},
                      disconnectedNodeAcknowledged: true,
                      state: "RUNNING"
                    }' > "${payload}"

                  if nifi_json "PUT" "/processors/${proc_id}/run-status" "${payload}" >/tmp/run-processor-response.json; then
                    return 0
                  fi
                  if [ $((attempt % 5)) -eq 0 ]; then
                    log "Start processor retry for ${proc_id} (attempt ${attempt}/25)"
                  fi
                  sleep 2
                done
                log "Failed to start processor ${proc_id}"
                return 1
              }

              log "Ensuring Kafka controller service..."
              kafka_controller_service_id="$(ensure_kafka_connection_service)"
              log "Kafka controller service id: ${kafka_controller_service_id}"

              log "Ensuring stage-1 processors..."
              s1_consume_id="$(ensure_processor "batch-stage1-consume-kafka" "org.apache.nifi.kafka.processors.ConsumeKafka" 80 120)"
              s1_replace_id="$(ensure_processor "batch-stage1-tag-content" "org.apache.nifi.processors.standard.ReplaceText" 460 120)"
              s1_rules_id="$(ensure_processor "batch-stage1-rules-engine-invoke" "org.apache.nifi.processors.standard.InvokeHTTP" 860 120)"
              s1_publish_id="$(ensure_processor "batch-stage1-publish-kafka" "org.apache.nifi.kafka.processors.PublishKafka" 1260 120)"

              s1_consume_props="$(jq -n \
                --arg cs "${kafka_controller_service_id}" \
                --arg topic "${TOPIC_STAGE1_FLINK_TO_NIFI}" \
                --arg group "${NIFI_STAGE1_CONSUMER_GROUP}" \
                '{
                  "Kafka Connection Service": $cs,
                  "Group ID": $group,
                  "Topic Format": "names",
                  "Topics": $topic
                }')"
              ensure_processor_properties "${s1_consume_id}" "${s1_consume_props}" '[]'

              s1_replace_props="$(jq -n \
                --arg evalMode "Entire text" \
                --arg strategy "Prepend" \
                --arg replacement "nifi-stage1|" \
                '{
                  "Evaluation Mode": $evalMode,
                  "Replacement Strategy": $strategy,
                  "Replacement Value": $replacement
                }')"
              ensure_processor_properties "${s1_replace_id}" "${s1_replace_props}" '["failure"]'

              s1_rules_props="$(jq -n \
                --arg url "${RULES_ENGINE_INVOKE_URL}" \
                '{
                  "HTTP Method": "GET",
                  "HTTP URL": $url,
                  "Response Generation Required": "true",
                  "Response Body Ignored": "false",
                  "Socket Read Timeout": "30 sec"
                }')"
              ensure_processor_properties "${s1_rules_id}" "${s1_rules_props}" '["Original", "Failure", "Retry", "No Retry"]'

              s1_publish_props="$(jq -n \
                --arg cs "${kafka_controller_service_id}" \
                --arg topic "${TOPIC_STAGE2_NIFI_TO_FLINK}" \
                '{
                  "Kafka Connection Service": $cs,
                  "Topic Name": $topic,
                  "Transactions Enabled": "false"
                }')"
              ensure_processor_properties "${s1_publish_id}" "${s1_publish_props}" '["failure", "success"]'

              ensure_connection "${s1_consume_id}" "${s1_replace_id}" "success" "batch-stage1-consume-to-replace"
              ensure_connection "${s1_replace_id}" "${s1_rules_id}" "success" "batch-stage1-replace-to-rules"
              ensure_connection "${s1_rules_id}" "${s1_publish_id}" "Response" "batch-stage1-rules-to-publish"

              log "Ensuring stage-2 processors..."
              s2_consume_id="$(ensure_processor "batch-stage2-consume-kafka" "org.apache.nifi.kafka.processors.ConsumeKafka" 80 520)"
              s2_replace_id="$(ensure_processor "batch-stage2-tag-content" "org.apache.nifi.processors.standard.ReplaceText" 460 520)"
              s2_openwebui_id="$(ensure_processor "batch-stage2-openwebui-invoke" "org.apache.nifi.processors.standard.InvokeHTTP" 860 520)"
              s2_publish_id="$(ensure_processor "batch-stage2-publish-kafka" "org.apache.nifi.kafka.processors.PublishKafka" 1260 520)"

              s2_consume_props="$(jq -n \
                --arg cs "${kafka_controller_service_id}" \
                --arg topic "${TOPIC_STAGE2_FLINK_TO_NIFI}" \
                --arg group "${NIFI_STAGE2_CONSUMER_GROUP}" \
                '{
                  "Kafka Connection Service": $cs,
                  "Group ID": $group,
                  "Topic Format": "names",
                  "Topics": $topic
                }')"
              ensure_processor_properties "${s2_consume_id}" "${s2_consume_props}" '[]'

              s2_replace_props="$(jq -n \
                --arg evalMode "Entire text" \
                --arg strategy "Prepend" \
                --arg replacement "nifi-stage2|" \
                '{
                  "Evaluation Mode": $evalMode,
                  "Replacement Strategy": $strategy,
                  "Replacement Value": $replacement
                }')"
              ensure_processor_properties "${s2_replace_id}" "${s2_replace_props}" '["failure"]'

              s2_openwebui_props="$(jq -n \
                --arg url "${OPENWEBUI_INVOKE_URL}" \
                '{
                  "HTTP Method": "GET",
                  "HTTP URL": $url,
                  "Response Generation Required": "true",
                  "Response Body Ignored": "false",
                  "Socket Read Timeout": "30 sec"
                }')"
              ensure_processor_properties "${s2_openwebui_id}" "${s2_openwebui_props}" '["Original", "Failure", "Retry", "No Retry"]'

              s2_publish_props="$(jq -n \
                --arg cs "${kafka_controller_service_id}" \
                --arg topic "${TOPIC_FINAL}" \
                '{
                  "Kafka Connection Service": $cs,
                  "Topic Name": $topic,
                  "Transactions Enabled": "false"
                }')"
              ensure_processor_properties "${s2_publish_id}" "${s2_publish_props}" '["failure", "success"]'

              ensure_connection "${s2_consume_id}" "${s2_replace_id}" "success" "batch-stage2-consume-to-replace"
              ensure_connection "${s2_replace_id}" "${s2_openwebui_id}" "success" "batch-stage2-replace-to-openwebui"
              ensure_connection "${s2_openwebui_id}" "${s2_publish_id}" "Response" "batch-stage2-openwebui-to-publish"

              log "Starting NiFi processors..."
              start_processor "${s1_publish_id}"
              start_processor "${s1_rules_id}"
              start_processor "${s1_replace_id}"
              start_processor "${s1_consume_id}"
              start_processor "${s2_publish_id}"
              start_processor "${s2_openwebui_id}"
              start_processor "${s2_replace_id}"
              start_processor "${s2_consume_id}"

              log "NiFi stage-chain bootstrap completed."
