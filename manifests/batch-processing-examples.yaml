# ============================================================================
# Batch processing examples (waves 50-53)
# - Kafka example topics and seed data
# - Flink SQL job submission for Kafka input/output pipeline
# - NiFi flow reference document (produce + consume chains)
# - Output verification as NiFi principal
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-kafka-config
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  bootstrap_servers: "kafka.kafka.svc.internal.lan:9092"
  security_protocol: "SASL_PLAINTEXT"
  sasl_mechanism: "SCRAM-SHA-256"
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-security-credentials
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
type: Opaque
stringData:
  admin_username: "<path:secret/data/kafka-admin-username#value>"
  admin_password: "<path:secret/data/kafka-admin-password#value>"
  nifi_username: "<path:secret/data/kafka-nifi-username#value>"
  nifi_password: "<path:secret/data/kafka-nifi-password#value>"
  flink_username: "<path:secret/data/kafka-flink-username#value>"
  flink_password: "<path:secret/data/kafka-flink-password#value>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-processing-examples-config
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  input_topic: "batch.example.nifi.raw.v1"
  output_topic: "batch.example.flink.enriched.v1"
  input_consumer_group: "flink-batch-example-v1"
  nifi_output_consumer_group: "nifi-batch-example-output-v1"
  flink_pipeline_name: "batch-example-nifi-to-flink"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-kafka-example-reference
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  kafka-batch-reference.md: |-
    # NiFi + Flink + Kafka Example Flow (Reference)

    This reference lives in the `dataflow` namespace for operators to copy into NiFi.
    It documents a minimal end-to-end example where:
    1. NiFi publishes to Kafka input topic.
    2. Flink consumes input topic and writes enriched records to output topic.
    3. NiFi consumes Flink output topic for downstream handling.

    ## Topics
    - NiFi -> Flink input: `batch.example.nifi.raw.v1`
    - Flink -> NiFi output: `batch.example.flink.enriched.v1`

    ## Chain A: NiFi producer flow (into Flink)
    1. `GenerateFlowFile`
    2. `UpdateAttribute`
    3. `PublishKafka_2_6`

    ## Suggested processor properties

    `GenerateFlowFile`
    - Run Schedule: `15 sec`
    - Custom Text:
      `event_source=nifi|event_time=${now():format("yyyy-MM-dd'T'HH:mm:ssXXX")}|event_id=${UUID()}`

    `UpdateAttribute`
    - `kafka.topic`: `batch.example.nifi.raw.v1`

    `PublishKafka_2_6`
    - Topic Name: `${kafka.topic}`
    - Delivery Guarantee: `at_least_once`
    - request.timeout.ms: `30000`
    - max.block.ms: `60000`
    - Security Protocol: `${BATCH_KAFKA_SECURITY_PROTOCOL}`
    - SASL Mechanism: `${BATCH_KAFKA_SASL_MECHANISM}`
    - SASL JAAS Config:
      `org.apache.kafka.common.security.scram.ScramLoginModule required username="${BATCH_KAFKA_USERNAME}" password="${BATCH_KAFKA_PASSWORD}";`
    - bootstrap.servers:
      `${BATCH_KAFKA_BOOTSTRAP_SERVERS}`

    ## Chain B: NiFi consumer flow (from Flink output)
    1. `ConsumeKafka_2_6`
    2. `RouteOnAttribute` (optional rules)
    3. `LogAttribute` (or your real sink processor)

    `ConsumeKafka_2_6`
    - Topic Name Format: `names`
    - Topics: `batch.example.flink.enriched.v1`
    - Group ID: `nifi-batch-example-output-v1`
    - Security Protocol: `${BATCH_KAFKA_SECURITY_PROTOCOL}`
    - SASL Mechanism: `${BATCH_KAFKA_SASL_MECHANISM}`
    - SASL JAAS Config:
      `org.apache.kafka.common.security.scram.ScramLoginModule required username="${BATCH_KAFKA_USERNAME}" password="${BATCH_KAFKA_PASSWORD}";`
    - bootstrap.servers:
      `${BATCH_KAFKA_BOOTSTRAP_SERVERS}`

    ## Verify end-to-end
    - Run Chain A in NiFi.
    - Confirm Flink output topic receives `flink-processed|...` records.
    - Run Chain B and verify NiFi receives those records.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-topics
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-example-kafka-topics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-kafka-topics
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-bootstrap
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_username
            - name: KAFKA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: output_topic
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-admin.properties"
              cat > "${CLIENT_CFG}" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_ADMIN_USERNAME}" password="${KAFKA_ADMIN_PASSWORD}";
              EOF

              echo "Waiting for Kafka API..."
              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --command-config "${CLIENT_CFG}" \
                --list >/dev/null 2>&1; do
                sleep 5
              done

              ensure_topic() {
                local topic="$1"
                if /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --command-config "${CLIENT_CFG}" \
                  --list | grep -qx "${topic}"; then
                  echo "Topic already exists: ${topic}"
                else
                  echo "Creating topic: ${topic}"
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                    --command-config "${CLIENT_CFG}" \
                    --create \
                    --topic "${topic}" \
                    --partitions 3 \
                    --replication-factor 1
                fi
              }

              ensure_topic "${INPUT_TOPIC}"
              ensure_topic "${OUTPUT_TOPIC}"
              echo "Kafka example topics are ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-seed-input
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "51"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-example-kafka-seed-input
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-kafka-seed-input
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed-input-topic
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_NIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: KAFKA_NIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-nifi.properties"
              cat > "${CLIENT_CFG}" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_NIFI_USERNAME}" password="${KAFKA_NIFI_PASSWORD}";
              EOF

              echo "Seeding ${INPUT_TOPIC} with example records as NiFi principal..."
              tmp_payload="$(mktemp)"
              for i in $(seq 1 25); do
                printf 'event_source=nifi-seed|event_index=%03d|event_time=%s|event_id=%s\n' \
                  "${i}" \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  "$(cat /proc/sys/kernel/random/uuid)" >> "${tmp_payload}"
              done

              /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --producer.config "${CLIENT_CFG}" \
                --topic "${INPUT_TOPIC}" < "${tmp_payload}"

              echo "Seed data written to ${INPUT_TOPIC}."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-flink-submit
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "52"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-example-flink-submit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-flink-submit
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit-flink-job
          image: flink:1.20.3-scala_2.12-java17
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: output_topic
            - name: INPUT_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_consumer_group
            - name: FLINK_PIPELINE_NAME
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: flink_pipeline_name
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              FLINK_REST="http://flink-rest.kafka.svc.cluster.local:8081"
              CONNECTOR_JAR_URL="https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar"
              CONNECTOR_JAR_PATH="/tmp/flink-sql-connector-kafka-3.3.0-1.20.jar"

              http_probe() {
                local url="$1"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsS "${url}" >/dev/null
                elif command -v wget >/dev/null 2>&1; then
                  wget -qO- "${url}" >/dev/null
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              }

              echo "Waiting for Flink JobManager REST API..."
              until http_probe "${FLINK_REST}/overview"; do
                sleep 5
              done

              if [ ! -f "${CONNECTOR_JAR_PATH}" ]; then
                echo "Downloading Flink Kafka SQL connector..."
                if command -v curl >/dev/null 2>&1; then
                  curl -fL --retry 5 --retry-delay 2 \
                    "${CONNECTOR_JAR_URL}" \
                    -o "${CONNECTOR_JAR_PATH}"
                elif command -v wget >/dev/null 2>&1; then
                  wget -O "${CONNECTOR_JAR_PATH}" "${CONNECTOR_JAR_URL}"
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              fi

              cat > /tmp/batch-example.sql <<EOF
              ADD JAR 'file://${CONNECTOR_JAR_PATH}';
              SET 'pipeline.name' = '${FLINK_PIPELINE_NAME}';

              CREATE TABLE nifi_input (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${INPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.group.id' = '${INPUT_CONSUMER_GROUP}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'scan.startup.mode' = 'earliest-offset',
                'format' = 'raw'
              );

              CREATE TABLE flink_output (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${OUTPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'format' = 'raw'
              );

              INSERT INTO flink_output
              SELECT CONCAT('flink-processed|', raw_line)
              FROM nifi_input;
              EOF

              echo "Submitting Flink SQL pipeline from /tmp/batch-example.sql"
              /opt/flink/bin/sql-client.sh \
                -Drest.address=flink-rest.kafka.svc.cluster.local \
                -Drest.port=8081 \
                -f /tmp/batch-example.sql
              echo "Flink SQL submission completed."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-nifi-output-verify
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "53"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-example-nifi-output-verify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-nifi-output-verify
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: verify-flink-output-as-nifi
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_NIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: KAFKA_NIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: output_topic
            - name: NIFI_OUTPUT_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: nifi_output_consumer_group
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-nifi-consumer.properties"
              cat > "${CLIENT_CFG}" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_NIFI_USERNAME}" password="${KAFKA_NIFI_PASSWORD}";
              group.id=${NIFI_OUTPUT_CONSUMER_GROUP}
              auto.offset.reset=earliest
              EOF

              echo "Verifying Flink output topic ${OUTPUT_TOPIC} is readable as NiFi principal..."
              output_file="$(mktemp)"
              /opt/kafka/bin/kafka-console-consumer.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --consumer.config "${CLIENT_CFG}" \
                --topic "${OUTPUT_TOPIC}" \
                --timeout-ms 20000 \
                --max-messages 10 > "${output_file}" || true

              if [ ! -s "${output_file}" ]; then
                echo "No records observed on ${OUTPUT_TOPIC} for NiFi principal yet."
                echo "Expected after Flink submit: records prefixed with flink-processed|"
                echo "Continuing without failure so Argo sync is not blocked."
                exit 0
              fi

              echo "Sample records from ${OUTPUT_TOPIC}:"
              cat "${output_file}"
              echo "Verification successful."
