# ============================================================================
# Batch processing examples (waves 50-54)
# - Kafka staged topics and seed data
# - Two Flink SQL stage jobs (continuous streaming)
# - NiFi reference chains that bridge Flink stages through Kafka
# - Final output verification as NiFi principal
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-kafka-config
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  bootstrap_servers: "kafka.kafka.svc.internal.lan:9092"
  security_protocol: "SASL_PLAINTEXT"
  sasl_mechanism: "SCRAM-SHA-256"
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-security-credentials
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
type: Opaque
stringData:
  admin_username: "<path:secret/data/kafka-admin-username#value>"
  admin_password: "<path:secret/data/kafka-admin-password#value>"
  nifi_username: "<path:secret/data/kafka-nifi-username#value>"
  nifi_password: "<path:secret/data/kafka-nifi-password#value>"
  flink_username: "<path:secret/data/kafka-flink-username#value>"
  flink_password: "<path:secret/data/kafka-flink-password#value>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-processing-examples-config
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  topic_flink_stage1_input: "batch.example.stage1.input.v1"
  topic_flink_stage1_to_nifi_stage1: "batch.example.stage1.flink-to-nifi.v1"
  topic_nifi_stage1_to_flink_stage2: "batch.example.stage2.nifi-to-flink.v1"
  topic_flink_stage2_to_nifi_stage2: "batch.example.stage2.flink-to-nifi.v1"
  topic_nifi_stage2_final: "batch.example.stage3.nifi-final.v1"
  rules_engine_invoke_url: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/kie-server/services/rest/server/swagger.json"
  openwebui_invoke_url: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/open-webui/openapi.json"

  flink_stage1_consumer_group: "flink-batch-stage1-v1"
  flink_stage2_consumer_group: "flink-batch-stage2-v1"
  nifi_stage1_consumer_group: "nifi-batch-stage1-v1"
  nifi_stage2_consumer_group: "nifi-batch-stage2-v1"

  flink_stage1_pipeline_name: "batch-example-flink-stage1"
  flink_stage2_pipeline_name: "batch-example-flink-stage2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-kafka-example-reference
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  kafka-batch-reference.md: |-
    # Multi-Stage Flink + NiFi + Kafka Example (Reference)

    This reference lives in the `dataflow` namespace as documentation for the
    declarative NiFi bootstrap Job in `nifi-declarative-flow-crs.yaml`.
    The stage-1 and stage-2 NiFi chains are created/updated automatically.
    It models a chained topology:

    1. Flink stage 1 consumes topic A and writes topic B.
    2. NiFi stage 1 consumes topic B, tags content, calls Rules Engine via Gravitee, writes topic C.
    3. Flink stage 2 consumes topic C and writes topic D.
    4. NiFi stage 2 consumes topic D, tags content, calls OpenWebUI via Gravitee, writes topic E.

    ## Topic chain
    - Topic A: `batch.example.stage1.input.v1`
    - Topic B: `batch.example.stage1.flink-to-nifi.v1`
    - Topic C: `batch.example.stage2.nifi-to-flink.v1`
    - Topic D: `batch.example.stage2.flink-to-nifi.v1`
    - Topic E: `batch.example.stage3.nifi-final.v1`

    ## NiFi Stage 1 flow (B -> C)
    1. `ConsumeKafka_2_6`
    2. `ReplaceText` (prepend `nifi-stage1|`)
    3. `InvokeHTTP` (GET Rules Engine OpenAPI endpoint)
    4. `PublishKafka_2_6`

    Processor properties applied declaratively:

    `ConsumeKafka_2_6`
    - Topics: `batch.example.stage1.flink-to-nifi.v1`
    - Group ID: `nifi-batch-stage1-v1`
    - bootstrap.servers: `#{batch.kafka.bootstrap.servers}`
    - security.protocol: `#{batch.kafka.security.protocol}`
    - sasl.mechanism: `#{batch.kafka.sasl.mechanism}`
    - sasl.jaas.config:
      `org.apache.kafka.common.security.scram.ScramLoginModule required username="${kafka-security-credentials:nifi_username}" password="${kafka-security-credentials:nifi_password}";`

    `ReplaceText`
    - Replacement Strategy: `Prepend`
    - Replacement Value: `nifi-stage1|`

    `PublishKafka_2_6`
    - Topic Name: `batch.example.stage2.nifi-to-flink.v1`
    - bootstrap.servers: `#{batch.kafka.bootstrap.servers}`
    - security.protocol: `#{batch.kafka.security.protocol}`
    - sasl.mechanism: `#{batch.kafka.sasl.mechanism}`

    ## NiFi Stage 2 flow (D -> E)
    1. `ConsumeKafka_2_6`
    2. `ReplaceText` (prepend `nifi-stage2|`)
    3. `InvokeHTTP` (GET OpenWebUI OpenAPI endpoint)
    4. `PublishKafka_2_6`

    Processor properties applied declaratively:

    `ConsumeKafka_2_6`
    - Topics: `batch.example.stage2.flink-to-nifi.v1`
    - Group ID: `nifi-batch-stage2-v1`
    - bootstrap.servers: `#{batch.kafka.bootstrap.servers}`
    - security.protocol: `#{batch.kafka.security.protocol}`
    - sasl.mechanism: `#{batch.kafka.sasl.mechanism}`

    `ReplaceText`
    - Replacement Strategy: `Prepend`
    - Replacement Value: `nifi-stage2|`

    `PublishKafka_2_6`
    - Topic Name: `batch.example.stage3.nifi-final.v1`

    ## Verification
    - Seed Topic A with this repo Job.
    - Confirm stage records advance across topics B/C/D/E.
    - Use the final verification Job to consume sample records from topic E.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-topics-v3
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-kafka-topics-v3
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-bootstrap
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_username
            - name: KAFKA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_password
            - name: TOPIC_STAGE1_INPUT
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_input
            - name: TOPIC_STAGE1_FLINK_TO_NIFI
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_to_nifi_stage1
            - name: TOPIC_STAGE2_NIFI_TO_FLINK
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_nifi_stage1_to_flink_stage2
            - name: TOPIC_STAGE2_FLINK_TO_NIFI
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage2_to_nifi_stage2
            - name: TOPIC_FINAL
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_nifi_stage2_final
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-admin.properties"
              cat > "${CLIENT_CFG}" <<EOF_KAFKA
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_ADMIN_USERNAME}" password="${KAFKA_ADMIN_PASSWORD}";
              EOF_KAFKA

              echo "Waiting for Kafka API..."
              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --command-config "${CLIENT_CFG}" \
                --list >/dev/null 2>&1; do
                sleep 5
              done

              ensure_topic() {
                local topic="$1"
                if /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --command-config "${CLIENT_CFG}" \
                  --list | grep -qx "${topic}"; then
                  echo "Topic already exists: ${topic}"
                else
                  echo "Creating topic: ${topic}"
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                    --command-config "${CLIENT_CFG}" \
                    --create \
                    --topic "${topic}" \
                    --partitions 3 \
                    --replication-factor 1
                fi
              }

              ensure_topic "${TOPIC_STAGE1_INPUT}"
              ensure_topic "${TOPIC_STAGE1_FLINK_TO_NIFI}"
              ensure_topic "${TOPIC_STAGE2_NIFI_TO_FLINK}"
              ensure_topic "${TOPIC_STAGE2_FLINK_TO_NIFI}"
              ensure_topic "${TOPIC_FINAL}"

              echo "Kafka staged example topics are ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-seed-stage1-v3
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "51"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-kafka-seed-stage1-v3
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed-stage1-topic
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_NIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: KAFKA_NIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
            - name: TOPIC_STAGE1_INPUT
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_input
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-nifi.properties"
              cat > "${CLIENT_CFG}" <<EOF_KAFKA
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_NIFI_USERNAME}" password="${KAFKA_NIFI_PASSWORD}";
              EOF_KAFKA

              echo "Seeding ${TOPIC_STAGE1_INPUT} with example records..."
              payload_file="$(mktemp)"
              for i in $(seq 1 25); do
                printf 'event_source=batch-seed|event_stage=0|event_index=%03d|event_time=%s|event_id=%s\n' \
                  "${i}" \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  "$(cat /proc/sys/kernel/random/uuid)" >> "${payload_file}"
              done

              /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --producer.config "${CLIENT_CFG}" \
                --topic "${TOPIC_STAGE1_INPUT}" < "${payload_file}"

              echo "Seed data written to ${TOPIC_STAGE1_INPUT}."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-flink-stage1-submit-v3
  namespace: dataflow
  annotations:
    argocd.argoproj.io/sync-wave: "52"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-example-flink-stage1-submit-v3
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit-flink-stage1
          image: flink:1.20.3-scala_2.12-java17
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_input
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: topic_flink_stage1_to_nifi_stage1
            - name: INPUT_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: flink_stage1_consumer_group
            - name: FLINK_PIPELINE_NAME
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: flink_stage1_pipeline_name
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              FLINK_REST="http://flink-rest.kafka.svc.cluster.local:8081"
              CONNECTOR_JAR_URL="https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar"
              CONNECTOR_JAR_PATH="/tmp/flink-sql-connector-kafka-3.3.0-1.20.jar"

              http_probe() {
                local url="$1"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsS "${url}" >/dev/null
                elif command -v wget >/dev/null 2>&1; then
                  wget -qO- "${url}" >/dev/null
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              }

              echo "Waiting for Flink JobManager REST API..."
              until http_probe "${FLINK_REST}/overview"; do
                sleep 5
              done

              if [ ! -f "${CONNECTOR_JAR_PATH}" ]; then
                echo "Downloading Flink Kafka SQL connector..."
                if command -v curl >/dev/null 2>&1; then
                  curl -fL --retry 5 --retry-delay 2 \
                    "${CONNECTOR_JAR_URL}" \
                    -o "${CONNECTOR_JAR_PATH}"
                elif command -v wget >/dev/null 2>&1; then
                  wget -O "${CONNECTOR_JAR_PATH}" "${CONNECTOR_JAR_URL}"
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              fi

              cat > /tmp/batch-example-stage1.sql <<EOF_SQL
              ADD JAR 'file://${CONNECTOR_JAR_PATH}';
              SET 'pipeline.name' = '${FLINK_PIPELINE_NAME}';

              CREATE TABLE stage1_input (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${INPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.group.id' = '${INPUT_CONSUMER_GROUP}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'scan.startup.mode' = 'earliest-offset',
                'format' = 'raw'
              );

              CREATE TABLE stage1_output (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${OUTPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'format' = 'raw'
              );

              INSERT INTO stage1_output
              SELECT CONCAT('flink-stage1|', raw_line)
              FROM stage1_input;
              EOF_SQL

              echo "Submitting Flink stage 1 SQL pipeline..."
              /opt/flink/bin/sql-client.sh \
                -Drest.address=flink-rest.kafka.svc.cluster.local \
                -Drest.port=8081 \
                -f /tmp/batch-example-stage1.sql

              echo "Flink stage 1 SQL submission completed."
---
